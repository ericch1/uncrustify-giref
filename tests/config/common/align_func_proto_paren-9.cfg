# align_func_proto_paren with explicit spaces before the open parenthesis
indent_columns                          = 4
indent_with_tabs                        = 0
indent_class                            = true
nl_func_leave_one_liners                = true
nl_class_leave_one_liners               = true
align_on_operator                       = true
align_func_proto_span                   = 3
align_func_proto_paren                  = true
sp_func_proto_paren                     = add
sp_func_proto_paren_empty               = remove
sp_func_class_paren                     = force
sp_func_def_paren                       = add
