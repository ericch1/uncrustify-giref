# align_func_proto_paren with span 1 and the span_num budgets
indent_columns                          = 4
indent_with_tabs                        = 0
indent_class                            = true
nl_func_leave_one_liners                = true
nl_class_leave_one_liners               = true
align_on_operator                       = true
align_func_proto_span                   = 1
align_func_proto_span_num_empty_lines   = 2
align_func_proto_span_num_pp_lines      = 3
align_func_proto_span_num_cmt_lines     = 4
align_func_proto_paren                  = true
